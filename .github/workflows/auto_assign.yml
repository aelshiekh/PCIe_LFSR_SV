name: Auto Assign Reviewers

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Request Reviewers
        uses: actions/github-script@v7
        with:
          script: |
            const defaultReviewers = ['aelshiekh', 'AbdelrahmanTarekMohamed'];
            const prAuthor = context.payload.pull_request.user.login;
            
            // Remove the author from the reviewers list to avoid API errors
            const reviewersToAssign = defaultReviewers.filter(user => user !== prAuthor);
            
            if (reviewersToAssign.length > 0) {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                reviewers: reviewersToAssign
              });
            }
